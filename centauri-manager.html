<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M7 2h10v6h2v5h-2.5L13 17h-2l-3.5-4H5V8h2V2m3 20H2v-2h8a1 1 0 0 0 1-1v-1h2v1a3 3 0 0 1-3 3Z'/></svg>">
    <title data-i18n="title">Centauri Carbon Manager</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 700px; 
            margin: 2rem auto; 
            background: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
        body.dark-mode {
            --bg-color: #111827;
            --surface: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #374151;
        }

        .container {
            background: var(--surface);
            padding: 30px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.5);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h2 { 
            margin: 0; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Language Selector */
        .lang-select {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-main);
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }
        .lang-select:focus {
            border-color: var(--primary);
        }

        /* Screens */
        #setupScreen { display: flex; flex-direction: column; gap: 20px; }
        #mainScreen { display: none; }

        .input-group { display: flex; gap: 12px; }
        
        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
            background: #f9fafb;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            background: var(--surface);
        }
        
        /* Buttons */
        button { 
            padding: 12px 24px; 
            font-size: 14px; 
            font-weight: 600;
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        button:active { transform: scale(0.98); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover:not(:disabled) { background: var(--danger-hover); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3); }
        .btn-danger:disabled { background: #fca5a5; cursor: not-allowed; }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 24px;
            gap: 10px;
        }
        .tab {
            padding: 12px 20px;
            background: transparent;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            border-radius: 8px 8px 0 0;
        }
        .tab:hover:not(.active) { color: var(--text-main); background: #f9fafb; }
        .tab.active {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            margin-bottom: -2px;
        }

        /* Filter & Controls Bar */
        .controls-bar {
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px; 
            gap: 15px; 
            padding: 12px; 
            background: var(--bg-color); 
            border-radius: 8px; 
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .search-box {
            position: relative;
            flex: 1;
        }
        .search-box input {
            width: 100%;
            padding: 10px 10px 10px 36px;
            margin: 0;
            box-sizing: border-box;
            font-family: monospace;
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            opacity: 0.5;
        }

        .select-all-wrapper {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            width: auto;
        }

        /* Checkboxes Global */
        input[type="checkbox"] { 
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
            margin: 0;
        }

        /* List Area */
        ul { 
            list-style: none; 
            padding: 0; 
            margin: 0;
            height: 50vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
        }
        
        ul::-webkit-scrollbar { width: 8px; }
        ul::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 0 8px 8px 0; }
        ul::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ul::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }

        li { 
            padding: 14px 16px; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            align-items: center; 
            transition: background 0.1s;
        }
        li:hover { background-color: #f0fdf4; }
        li:last-child { border-bottom: none; }
        
        /* Specific List Items */
        #itemList input[type="checkbox"] {
            margin-right: 16px; 
        }
        
        #itemList label {
            cursor: pointer;
            width: 100%;
            word-break: break-all;
            display: flex;
            flex-direction: column;
            font-size: 15px;
            font-weight: 500;
        }

        .item-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 400;
        }
        
        /* Status Bar */
        #errorMsg { color: var(--danger); font-size: 14px; font-weight: 500; margin-top: 8px; }
        
        .status-bar {
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        .disconnect-btn {
            background: none; color: var(--text-muted); padding: 6px 12px; 
            border: 1px solid var(--border); border-radius: 6px;
        }
        .disconnect-btn:hover { background: #f3f4f6; color: var(--danger); border-color: #fca5a5; }

        /* Footer */
        .footer { 
            margin-top: auto; 
            padding-top: 25px; 
            font-size: 12px; 
            color: var(--text-muted); 
            text-align: center; 
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

        <div class="header-top">
            <h2 id="title">

                <span data-i18n="title">Centauri Carbon Manager</span>

            <button class="lang-select" onclick="toggleDarkMode()">🌓</button>
            <select class="lang-select" id="langSelect" onchange="changeLang(this.value)">

                <option value="de">🇩🇪 DE</option>

        </div>
        
        <!-- Setup Screen -->
        <div id="setupScreen">
            <p style="margin: 0; font-size: 15px; color: var(--text-muted);" data-i18n="setupDesc">Connect directly to your printer to manage files and history rapidly.</p>
            <div class="input-group">
                <input type="text" id="ipInput" data-i18n="ipPlaceholder" placeholder="Printer IP (e.g. 192.168.0.17)" value="192.168.0.17">
                <button class="btn-primary" id="connectBtn" onclick="connect()" data-i18n="connectBtn">Connect</button>
            </div>
            <div id="errorMsg"></div>
        </div>

        <!-- Main Content -->
        <div id="mainScreen">
            <div class="tabs">
                <button class="tab active" id="tab-local" onclick="switchTab('local')" data-i18n="tabLocal">Local Files</button>
                <button class="tab" id="tab-history" onclick="switchTab('history')" data-i18n="tabHistory">Print History</button>
            </div>

            <!-- Controls Bar -->
            <div class="controls-bar">
                <label class="select-all-wrapper">
                    <input type="checkbox" id="selectAll" onclick="toggleSelectAll()"> 
                    <span data-i18n="selectAll">Select All</span>
                </label>
                
                <div class="search-box">
                    <input type="text" id="searchInput" data-i18n="filterPlaceholder" placeholder="Filter (e.g. *PLA*, benchy*)" onkeyup="filterItems()">
                </div>
                <button class="btn-refresh" onclick="fetchData()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 1024 1027">
                        <path fill="#000000" d="M990 1L856 135q-69-63-157.5-98.5T512 1Q353 1 223.5 90.5T37 323l119 48q43-108 139.5-175T512 129q145 0 254 97L640 353q-1 14 8.5 23.5T672 385h309q14 0 27.5-13.5T1023 344l1-320q1-24-34-23zM512 897q-145 0-254-96l126-127q1-14-8.5-23.5T352 641H43q-14 1-27.5 14.5T1 683l-1 320q-1 24 34 23l134-134q69 63 157.5 98t186.5 35q159 0 288.5-89T987 703l-119-47q-43 108-139.5 174.5T512 897z"/>
                    </svg>
                </button>
                <button class="btn-danger" id="deleteBtn" onclick="deleteSelected()" disabled><span data-i18n="deleteBtn">Delete</span> (0)</button>
            </div>
            
            <ul id="itemList"></ul>
            
            <div class="status-bar">
                <button class="disconnect-btn" onclick="disconnect()" data-i18n="disconnect">Disconnect</button>
                <span id="itemCount" data-i18n="loadingData">Loading data...</span>
            </div>
            <div class="container">
                <div class="footer">
                    Created by <strong>Broby IT</strong> | Centauri Carbon Manager v1.0
                </div>
            </div>
        </div>
    </div>

        // Helper function for quick translation lookups
        function t(key) {
            return translations[currentLang][key] || key;
        }

        // Toggle Theme
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
        }
               
        // --- Language Handling ---
        function changeLang(lang) {
            currentLang = lang;

            // 1. Update the title in the browser
            document.title = t('title');

            // 2. Update the title text inside the span (keeping the icon outside)
            const titleSpan = document.querySelector('h2 span[data-i18n="title"]');
            if (titleSpan) {
                titleSpan.innerText = t('title');
            }

            // 3. Update all other static elements with data-i18n attribute
            document.querySelectorAll('[data-i18n]:not(h2 span)').forEach(el => {
                const key = el.getAttribute('data-i18n');
                // Handle input placeholders specifically
                if (el.tagName === 'INPUT' && el.placeholder) {
                    el.placeholder = t(key);
                } else if (el.tagName !== 'SPAN' || el.parentElement.tagName !== 'H2') {
                    // Update innerText for buttons, tabs, etc.
                    el.innerText = t(key);
                }
            });
            
            // 4. Update dynamic text and state
            if (document.getElementById('mainScreen').style.display === 'block') {
                updateDeleteButton();
                filterItems(); // Refreshes item count string
                
                // Refresh list to translate "No items found" if the list is empty
                if (currentItemCount === 0) {
                    document.getElementById('itemList').innerHTML = `<li><em style="color:var(--text-muted);">${t('noItems')}</em></li>`;
                } else {
                    // Re-render items to translate file labels if needed
                    // Only necessary if we want labels to translate dynamically
                }
            } else {
                setUIStateConnecting(ws && ws.readyState === WebSocket.CONNECTING);
            }
        }

        // --- WebSocket Logic ---
        function createPayload(cmd, data) {
            return {
                Id: "",
                Data: {
                    Cmd: cmd,
                    Data: data,
                    RequestID: crypto.randomUUID().replace(/-/g, ''),
                    MainboardID: "",
                    TimeStamp: Date.now(),
                    From: 1
                }
            };
        }

        function setUIStateConnecting(isConnecting) {
            const btn = document.getElementById('connectBtn');
            const input = document.getElementById('ipInput');
            btn.disabled = isConnecting;
            input.disabled = isConnecting;
            btn.innerText = isConnecting ? t('connectingBtn') : t('connectBtn');
            if (isConnecting) document.getElementById('errorMsg').innerText = "";
        }

        function switchScreen(toMain) {
            document.getElementById('setupScreen').style.display = toMain ? 'none' : 'flex';
            document.getElementById('mainScreen').style.display = toMain ? 'block' : 'none';
        }

        function connect() {
            const ip = document.getElementById('ipInput').value.trim();
            if (!ip) { alert(t('errInvalidIp')); return; }

            setUIStateConnecting(true);
            if (ws) { ws.close(); }

            ws = new WebSocket(`ws://${ip}/websocket`);
            
            ws.onopen = () => {
                setUIStateConnecting(false);
                switchScreen(true);
                activeTab = 'local';
                updateTabUI();
                fetchData();
            };

            ws.onmessage = (event) => {
                const res = JSON.parse(event.data);
                const dataBlock = res.Data || {};
                const cmd = dataBlock.Cmd;
                
                if (cmd === 258 && activeTab === 'local') {
                    renderList(dataBlock.Data?.FileList || [], 'local');
                } else if (cmd === 259) {
                    if (dataBlock.Data?.Ack === 0) fetchData();
                    else alert(t('errDelFailed') + dataBlock.Data?.Ack);
                } else if (cmd === 320 && activeTab === 'history') {
                    const historyIds = dataBlock.Data?.HistoryData || [];
                    if (historyIds.length > 0) {
                        // Forward request to fetch full details
                        ws.send(JSON.stringify(createPayload(321, { Id: historyIds })));
                    } else {
                        renderList([], 'history');
                    }
                } else if (cmd === 321 && activeTab === 'history') {
                    renderList(dataBlock.Data?.HistoryDetailList || [], 'history');
                } else if (cmd === 322) {
                    if (dataBlock.Data?.Ack === 0) fetchData();
                    else alert(t('errDelFailed') + dataBlock.Data?.Ack);
                }
            };

            ws.onerror = (error) => {
                setUIStateConnecting(false);
                document.getElementById('errorMsg').innerText = t('errConnFailed');
            };

            ws.onclose = () => {
                setUIStateConnecting(false);
                if (document.getElementById('mainScreen').style.display === 'block') {
                    alert(t('errWsClosed'));
                }
                switchScreen(false);
            };
        }

        function disconnect() { if (ws) ws.close(); }

        // --- UI Operations ---
        function switchTab(tabName) {
            if (activeTab === tabName) return;
            activeTab = tabName;
            document.getElementById('searchInput').value = "";
            updateTabUI();
            fetchData();
        }

        function updateTabUI() {
            document.getElementById('tab-local').className = activeTab === 'local' ? 'tab active' : 'tab';
            document.getElementById('tab-history').className = activeTab === 'history' ? 'tab active' : 'tab';
            document.getElementById('selectAll').checked = false;
            updateDeleteButton();
        }

        function fetchData() {
            const list = document.getElementById('itemList');
            list.innerHTML = `<li><span style="color:var(--text-muted);">${t('loadingData')}</span></li>`;
            document.getElementById('itemCount').innerText = t('loadingData');
            
            if (activeTab === 'local') {
                ws.send(JSON.stringify(createPayload(258, { Url: "/local" })));
            } else if (activeTab === 'history') {
                ws.send(JSON.stringify(createPayload(320, {})));
            }
        }

        function renderList(items, mode) {
            if (mode !== activeTab) return;

            const list = document.getElementById('itemList');
            list.innerHTML = '';
            currentItemCount = items.length;
            
            if (items.length === 0) {
                list.innerHTML = `<li><em style="color:var(--text-muted);">${t('noItems')}</em></li>`;
                document.getElementById('itemCount').innerText = `0 ${t('itemsTotal')}`;
                updateDeleteButton();
                return;
            }
            
            items.forEach((item, index) => {
                const itemValue = mode === 'local' ? item.name : item.TaskId;
                let itemLabel = mode === 'local' ? item.name : item.TaskName;
                if (!itemValue) return;
                
                // Strip unnecessary folder prefixes
                itemLabel = itemLabel.replace('/local/', '').replace('/history/', '');
                
                const li = document.createElement('li');
                li.setAttribute('data-search-term', itemLabel.toLowerCase());
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = itemValue;
                cb.id = `item_${index}`;
                cb.onchange = () => {
                    handleSingleCheckboxChange();
                    updateDeleteButton();
                };
                
                const label = document.createElement('label');
                label.htmlFor = `item_${index}`;
                label.innerHTML = `<span>${itemLabel || t('unknownItem')}</span>`;
                
                // Calculate print duration from elapsed machine time
                if (mode === 'history' && item.BeginTime && item.EndTime) {
                    const durationSecs = item.EndTime - item.BeginTime;
                    
                    if (durationSecs > 0) {
                        const hours = Math.floor(durationSecs / 3600);
                        const minutes = Math.floor((durationSecs % 3600) / 60);
                        let durationStr = '';
                        if (hours > 0) durationStr += `${hours}h `;
                        durationStr += `${minutes}m`;
                        
                        label.innerHTML += `<span class="item-subtitle">${t('printDuration')}: ${durationStr}</span>`;
                    }
                }
                
                li.appendChild(cb);
                li.appendChild(label);
                list.appendChild(li);
            });
            
            filterItems(); // Re-apply filter automatically after fetch
        }

        function filterItems() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const listItems = document.querySelectorAll('#itemList li');
            let visibleCount = 0;

            if (!query) {
                listItems.forEach(li => {
                    li.style.display = 'flex';
                    visibleCount++;
                });
            } else {
                // Convert string to a safe Regex, accommodating * and ? wildcards
                let regexStr = query.replace(/[.+^${}()|[\]\\]/g, '\\$&'); 
                
                // If user explicitly uses wildcards, anchor the search strictly
                if (query.includes('*') || query.includes('?')) {
                    regexStr = '^' + regexStr.replace(/\*/g, '.*').replace(/\?/g, '.') + '$';
                } 
                
                let searchRegex;
                try {
                    searchRegex = new RegExp(regexStr, 'i');
                } catch (e) {
                    searchRegex = new RegExp(''); // Fallback if regex is invalid
                }

                listItems.forEach(li => {
                    const term = li.getAttribute('data-search-term');
                    if (!term) return;

                    if (searchRegex.test(term)) {
                        li.style.display = 'flex';
                        visibleCount++;
                    } else {
                        li.style.display = 'none';
                        const cb = li.querySelector('input[type="checkbox"]');
                        if (cb && cb.checked) cb.checked = false; // Deselect if hidden
                    }
                });
            }

            // Update item count UI
            document.getElementById('itemCount').innerText = 
                query ? `${t('showing')} ${visibleCount} ${t('of')} ${currentItemCount} ${t('items')}` : `${currentItemCount} ${t('itemsTotal')}`;
            
            // Uncheck global toggle if filter applies
            document.getElementById('selectAll').checked = false;
            updateDeleteButton();
        }

        function toggleSelectAll() {
            const isChecked = document.getElementById('selectAll').checked;
            const visibleCheckboxes = document.querySelectorAll('#itemList li:not([style*="display: none"]) input[type="checkbox"]');
            
            visibleCheckboxes.forEach(cb => { cb.checked = isChecked; });
            updateDeleteButton();
        }

        function handleSingleCheckboxChange() {
            const visibleCheckboxes = Array.from(document.querySelectorAll('#itemList li:not([style*="display: none"]) input[type="checkbox"]'));
            const allChecked = visibleCheckboxes.length > 0 && visibleCheckboxes.every(cb => cb.checked);
            document.getElementById('selectAll').checked = allChecked;
        }

        function updateDeleteButton() {
            const checkedCount = document.querySelectorAll('#itemList input[type="checkbox"]:checked').length;
            const deleteBtn = document.getElementById('deleteBtn');
            
            if (checkedCount > 0) {
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = `<span data-i18n="deleteBtn">${t('deleteBtn')}</span> (${checkedCount})`;
            } else {
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = `<span data-i18n="deleteBtn">${t('deleteBtn')}</span> (0)`;
            }
        }

        function deleteSelected() {
            const checkedBoxes = document.querySelectorAll('#itemList input[type="checkbox"]:checked');
            const itemsToDelete = Array.from(checkedBoxes).map(cb => cb.value);
            
            if (itemsToDelete.length === 0) return;
            
            const tabTranslation = activeTab === 'local' ? t('tabLocal') : t('tabHistory');
            
            if (confirm(`${t('confirmDelete1')}${itemsToDelete.length}${t('confirmDelete2')}${tabTranslation}${t('confirmDelete3')}`)) {
                let payload = createPayload(activeTab === 'local' ? 259 : 322, 
                    activeTab === 'local' ? { FileList: itemsToDelete } : { Id: itemsToDelete }
                );
                
                ws.send(JSON.stringify(payload));
                
                const deleteBtn = document.getElementById('deleteBtn');
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = `<span data-i18n="deletingBtn">${t('deletingBtn')}</span>`;
            }
        }

        // Initialize translations on first load
        changeLang('en');
        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode')
    </script>
</body>
</html>
