<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M7 2h10v6h2v5h-2.5L13 17h-2l-3.5-4H5V8h2V2m3 20H2v-2h8a1 1 0 0 0 1-1v-1h2v1a3 3 0 0 1-3 3Z'/></svg>">
    <title data-i18n="title">Centauri Carbon Manager</title>
    <style>
        /* --- CSS Variables & Theming --- */
        :root {
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark-mode {
            --bg-color: #111827;
            --surface: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border: #374151;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* --- Base Setup --- */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            max-width: 760px; 
            margin: 2rem auto; 
            padding: 0 1rem;
            background: var(--bg-color);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease;
        }

        .container {
            background: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        
        /* --- Typography & Header --- */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 10px;
            flex-wrap: wrap;
        }

        h2 { 
            margin: 0; 
            font-weight: 800; 
            letter-spacing: -0.5px; 
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 250px;
        }

        h2 svg { fill: currentColor; }

        /* --- Inputs & Selects --- */
        .input-group { display: flex; gap: 12px; flex-wrap: wrap; }
        
        input[type="text"], select {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--bg-color);
            color: var(--text-main);
            transition: var(--transition);
        }
        input[type="text"] { flex: 1; min-width: 200px; }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
            background: var(--surface);
        }

        .lang-select-group { display: flex; gap: 8px; }
        
        /* --- Buttons --- */
        button { 
            padding: 10px 20px; 
            font-size: 14px; 
            font-weight: 600;
            border: 1px solid transparent; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover:not(:disabled) { background: var(--danger-hover); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2); }
        
        .btn-outline { background: transparent; border-color: var(--border); color: var(--text-main); }
        .btn-outline:hover:not(:disabled) { background: var(--bg-color); }
        .btn-icon { padding: 10px; }
        .btn-icon svg { fill: currentColor; }

        /* --- Layout States --- */
        #setupScreen { display: flex; flex-direction: column; gap: 24px; }
        #mainScreen { display: none; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Tabs --- */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            gap: 8px;
        }
        .tab {
            padding: 12px 24px;
            background: transparent;
            color: var(--text-muted);
            border-bottom: 3px solid transparent;
            border-radius: 8px 8px 0 0;
        }
        .tab:hover:not(.active) { color: var(--text-main); background: var(--bg-color); }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); margin-bottom: -2px; }

        /* --- Controls Bar --- */
        .controls-bar {
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px; 
            gap: 12px; 
            padding: 12px; 
            background: var(--bg-color); 
            border-radius: var(--radius); 
            border: 1px solid var(--border);
        }

        .search-box { position: relative; flex: 1; min-width: 150px; }
        .search-box input { width: 100%; padding-left: 36px; box-sizing: border-box; }
        .search-box::before {
            content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
            font-size: 14px; opacity: 0.5; pointer-events: none;
        }

        .select-all-wrapper {
            display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); margin: 0; }

        /* --- List Area --- */
        ul { 
            list-style: none; padding: 0; margin: 0;
            height: 50vh; overflow-y: auto;
            border: 1px solid var(--border); border-radius: var(--radius);
            background: var(--surface);
        }
        
        ul::-webkit-scrollbar { width: 8px; }
        ul::-webkit-scrollbar-track { background: transparent; }
        ul::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ul::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        li { 
            padding: 14px 16px; border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; gap: 16px; transition: background 0.1s;
        }
        li:hover { background-color: rgba(59, 130, 246, 0.05); }
        li:last-child { border-bottom: none; }
        
        .item-content { flex: 1; display: flex; flex-direction: column; cursor: pointer; word-break: break-all; }
        .item-header { display: flex; justify-content: space-between; align-items: center; width: 100%; font-weight: 500; }
        .item-meta { font-size: 0.85em; color: var(--text-muted); font-family: monospace; }
        .item-subtitle { font-size: 0.8em; color: var(--text-muted); margin-top: 4px; }
        
        /* --- Status & Footer --- */
        .status-bar {
            margin-top: 20px; font-size: 13px; color: var(--text-muted);
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 16px; border-top: 1px solid var(--border);
        }

        .footer { 
            margin-top: 2rem; font-size: 12px; color: var(--text-muted); 
            text-align: center; 
        }

        /* --- Custom Modal UI --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
            opacity: 0; transition: opacity 0.2s;
        }
        .modal-overlay.show { display: flex; opacity: 1; }
        .modal {
            background: var(--surface); padding: 24px; border-radius: var(--radius); 
            width: 90%; max-width: 400px; box-shadow: var(--shadow); border: 1px solid var(--border);
            transform: scale(0.95); transition: transform 0.2s;
        }
        .modal-overlay.show .modal { transform: scale(1); }
        .modal h3 { margin-top: 0; color: var(--text-main); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }

        /* --- Toast Notifications --- */
        #toast-container {
            position: fixed; bottom: 20px; right: 20px; z-index: 3000;
            display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            padding: 12px 20px; border-radius: 8px; color: white; font-size: 14px; font-weight: 500;
            background: var(--text-main); box-shadow: var(--shadow);
            opacity: 0; transform: translateY(20px); transition: var(--transition);
            display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: var(--danger); }
        .toast.success { background: #10b981; }
    </style>
</head>
<body>

        <div class="header-top">
            <h2>
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24">
                    <path d="M12.686 7.479q.81 1.244 1.476 2.505c.64-1.217 1.849-2.086 3.328-2.086c2.217 0 3.826 1.954 3.826 4.102s-1.609 4.102-3.826 4.102c-.656 0-1.26-.171-1.784-.467l-.001-.001a4 4 0 0 1-1.509-1.553c-.484-.804-.725-1.706-.991-2.657c-.598-2.134-1.252-3.773-3.194-4.988a6.56 6.56 0 0 0-3.501-.985C2.815 5.451 0 8.323 0 12c0 3.727 2.761 6.549 6.51 6.549c1.955 0 3.639-.766 4.805-2.027a31 31 0 0 1-1.477-2.505c-.641 1.217-1.849 2.085-3.328 2.085c-2.218 0-3.827-1.953-3.827-4.102S4.292 7.898 6.51 7.898c.655 0 1.26.171 1.783.469h.001c.635.36 1.154.904 1.509 1.553c.574.951.807 2.041 1.144 3.188c.555 1.89 1.285 3.339 3.002 4.432a6.55 6.55 0 0 0 3.541 1.009c3.694 0 6.51-2.872 6.51-6.549c0-3.727-2.76-6.549-6.51-6.549c-1.954 0-3.64.766-4.804 2.028"/>
                </svg>

            <div class="lang-select-group">

        </div>
        
        <!-- Setup Screen -->
        <div id="setupScreen">
            <p style="margin: 0; font-size: 15px; color: var(--text-muted);" data-i18n="setupDesc">Connect directly to your printer to manage files and history rapidly.</p>
            <div class="input-group">
                <input type="text" id="ipInput" data-i18n="ipPlaceholder" placeholder="Printer IP (e.g. 192.168.0.17)" value="192.168.0.17">
                <button class="btn-primary" id="connectBtn" onclick="App.connect()">
                    <span data-i18n="connectBtn">Connect</span>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div id="mainScreen">
            <div class="tabs">
                <button class="tab active" id="tab-local" onclick="App.switchTab('local')" data-i18n="tabLocal">Local Files</button>
                <button class="tab" id="tab-history" onclick="App.switchTab('history')" data-i18n="tabHistory">Print History</button>
            </div>

            <!-- Controls Bar -->
            <div class="controls-bar">
                <label class="select-all-wrapper">
                    <input type="checkbox" id="selectAll" onclick="App.toggleSelectAll()"> 
                    <span data-i18n="selectAll">Select All</span>
                </label>
                <div style="display:flex; gap:5px;">
                    <button class="btn-outline" onclick="App.sortList('name')" style="padding: 6px 12px; font-size:12px;">A-Z ↕</button>
                    <button class="btn-outline" onclick="App.sortList('size')" style="padding: 6px 12px; font-size:12px;">Size ↕</button>
                </div>
                <div class="search-box">
                    <input type="text" id="searchInput" data-i18n="filterPlaceholder" placeholder="Filter (e.g. *PLA*)" oninput="App.filterItems()">
                </div>
                <button class="btn-outline btn-icon" onclick="App.fetchData()" title="Refresh">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 1024 1027"><path d="M990 1L856 135q-69-63-157.5-98.5T512 1Q353 1 223.5 90.5T37 323l119 48q43-108 139.5-175T512 129q145 0 254 97L640 353q-1 14 8.5 23.5T672 385h309q14 0 27.5-13.5T1023 344l1-320q1-24-34-23zM512 897q-145 0-254-96l126-127q1-14-8.5-23.5T352 641H43q-14 1-27.5 14.5T1 683l-1 320q-1 24 34 23l134-134q69 63 157.5 98t186.5 35q159 0 288.5-89T987 703l-119-47q-43 108-139.5 174.5T512 897z"/></svg>
                </button>
                <button class="btn-danger" id="deleteBtn" onclick="App.deleteSelected()" disabled>
                    <span data-i18n="deleteBtn">Delete</span> <span id="deleteCount">(0)</span>
                </button>
            </div>
            
            <ul id="itemList"></ul>
            
            <div class="status-bar">
                <div style="display: flex; gap: 10px;">
                    <button class="btn-outline" onclick="App.disconnect()" data-i18n="disconnect">Disconnect</button>
                    <button class="btn-outline" onclick="App.openWebUI()" data-i18n="openWebUI">Web UI ↗</button>
                </div>
                <span id="itemCount" data-i18n="loadingData">Loading data...</span>
            </div>
        </div>
    </div>
    
    <div class="footer">
        Created by <strong><a href="https://broby-it.dk" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Broby IT</a></strong> | Centauri Carbon Manager v<span id="appVersion"></span>
    </div>

    <!-- Custom Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">Confirm</h3>
            <p id="modalText"></p>
            <div class="modal-actions">
                <button id="modalCancel" class="btn-outline" data-i18n="confirmCancel">Cancel</button>
                <button id="modalConfirm" class="btn-danger" data-i18n="deleteBtn">Delete</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

        // --- Application State (KISS / Centralized) ---
        const State = {
            ws: null,
            activeTab: 'local',
            items: [],
            lang: 'en',
            sortDirection: 1, // 1: asc, -1: desc
            isConnecting: false
        };

        const t = (key) => i18n[State.lang][key] || key;

        // --- Core Application Logic ---
        const App = {
            init() {
                // Update verionnumber
                document.getElementById('appVersion').innerText = APP_VERSION;

                if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
                const savedLang = localStorage.getItem('lang') || 'en';
                document.getElementById('langSelect').value = savedLang;
                this.changeLang(savedLang);

                // Auto-connect if IP is provided via URL parameter (e.g. ?ip=192.168.0.17)
                const urlParams = new URLSearchParams(window.location.search);
                const autoIp = urlParams.get('ip');
                if (autoIp) {
                    document.getElementById('ipInput').value = autoIp;
                    setTimeout(() => this.connect(), 100);
                }
            },

            // --- UI Modals & Toasts (No more alerts!) ---
            showToast(msg, type = 'info') {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icon = type === 'error' ? '⚠️' : type === 'success' ? '✅' : 'ℹ️';
                toast.innerHTML = `<span>${icon}</span> <span>${msg}</span>`;
                container.appendChild(toast);
                
                // Trigger reflow for animation
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            },

            asyncConfirm(message) {
                return new Promise(resolve => {
                    const modal = document.getElementById('confirmModal');
                    document.getElementById('modalText').innerText = message;
                    modal.classList.add('show');

                    const cleanup = (result) => {
                        modal.classList.remove('show');
                        document.getElementById('modalConfirm').onclick = null;
                        document.getElementById('modalCancel').onclick = null;
                        resolve(result);
                    };

                    document.getElementById('modalConfirm').onclick = () => cleanup(true);
                    document.getElementById('modalCancel').onclick = () => cleanup(false);
                });
            },

            // --- Localization ---
            changeLang(lang) {
                State.lang = lang;
                localStorage.setItem('lang', lang);
                document.title = t('title');
                
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (el.tagName === 'INPUT' && el.placeholder) el.placeholder = t(key);
                    else el.innerText = t(key);
                });

                if (document.getElementById('mainScreen').style.display === 'block') {
                    this.updateDeleteButton();
                    this.filterItems();
                    if (State.items.length === 0) this.renderList([], State.activeTab);
                } else {
                    this.setConnectingState(State.isConnecting);
                }
            },

            toggleDarkMode() {
                document.body.classList.toggle('dark-mode');
                localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            },

            // --- WebSocket Logic ---
            createPayload(cmd, data) {
                return { Id: "", Data: { Cmd: cmd, Data: data, RequestID: crypto.randomUUID().replace(/-/g, ''), TimeStamp: Date.now(), From: 1 } };
            },

            setConnectingState(isConnecting) {
                State.isConnecting = isConnecting;
                const btn = document.getElementById('connectBtn');
                btn.disabled = isConnecting;
                document.getElementById('ipInput').disabled = isConnecting;
                btn.querySelector('span').innerText = isConnecting ? t('connectingBtn') : t('connectBtn');
            },

            connect() {
                const ip = document.getElementById('ipInput').value.trim();
                if (!ip) return this.showToast(t('errInvalidIp'), 'error');

                this.setConnectingState(true);
                if (State.ws) State.ws.close();

                try {
                    State.ws = new WebSocket(`ws://${ip}/websocket`);
                } catch (e) {
                    return this.showToast(t('errConnFailed'), 'error');
                }
                
                State.ws.onopen = () => {
                    this.setConnectingState(false);
                    document.getElementById('setupScreen').style.display = 'none';
                    document.getElementById('mainScreen').style.display = 'block';
                    
                    // Tving hentning af data ved første forbindelse. 
                    // switchTab afbryder, hvis vi allerede ER på 'local'.
                    if (State.activeTab === 'local') {
                        this.fetchData();
                    } else {
                        this.switchTab('local');
                    }
                };

                State.ws.onmessage = (event) => this.handleMessage(JSON.parse(event.data));

                State.ws.onerror = () => {
                    this.setConnectingState(false);
                    this.showToast(t('errConnFailed'), 'error');
                };

                State.ws.onclose = () => {
                    this.setConnectingState(false);
                    if (document.getElementById('mainScreen').style.display === 'block') {
                        this.showToast(t('errWsClosed'), 'error');
                    }
                    document.getElementById('setupScreen').style.display = 'flex';
                    document.getElementById('mainScreen').style.display = 'none';
                };
            },

            disconnect() {
                if (State.ws) State.ws.close();
            },

            openWebUI() {
                const ip = document.getElementById('ipInput').value.trim();
                if (ip) window.open(`http://${ip}`, '_blank');
            },

            handleMessage(res) {
                const dataBlock = res.Data || {};
                const cmd = dataBlock.Cmd;
                
                if (cmd === 258 && State.activeTab === 'local') {
                    this.renderList(dataBlock.Data?.FileList || [], 'local');
                } else if (cmd === 320 && State.activeTab === 'history') {
                    const historyIds = dataBlock.Data?.HistoryData || [];
                    if (historyIds.length > 0) State.ws.send(JSON.stringify(this.createPayload(321, { Id: historyIds })));
                    else this.renderList([], 'history');
                } else if (cmd === 321 && State.activeTab === 'history') {
                    this.renderList(dataBlock.Data?.HistoryDetailList || [], 'history');
                } else if (cmd === 259 || cmd === 322) { // Deletion Ack
                    if (dataBlock.Data?.Ack === 0) {
                        this.showToast(t('successDeleted'), 'success');
                        this.fetchData();
                    } else {
                        this.showToast(t('errDelFailed') + dataBlock.Data?.Ack, 'error');
                        this.updateDeleteButton(false); // reset button UI
                    }
                }
            },

            // --- Data & DOM Rendering ---
            switchTab(tabName) {
                if (State.activeTab === tabName) return;
                State.activeTab = tabName;
                document.getElementById('searchInput').value = "";
                
                document.getElementById('tab-local').className = tabName === 'local' ? 'tab active' : 'tab';
                document.getElementById('tab-history').className = tabName === 'history' ? 'tab active' : 'tab';
                document.getElementById('selectAll').checked = false;
                
                this.updateDeleteButton();
                this.fetchData();
            },

            fetchData() {
                document.getElementById('itemList').innerHTML = `<li><span style="color:var(--text-muted);">${t('loadingData')}</span></li>`;
                document.getElementById('itemCount').innerText = t('loadingData');
                
                if (State.activeTab === 'local') State.ws.send(JSON.stringify(this.createPayload(258, { Url: "/local" })));
                else State.ws.send(JSON.stringify(this.createPayload(320, {})));
            },

            formatSize(bytes) {
                if (!bytes) return '0 B';
                const k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
            },

            renderList(items, mode) {
                if (mode !== State.activeTab) return;
                State.items = items;
                
                const list = document.getElementById('itemList');
                list.innerHTML = '';
                
                if (items.length === 0) {
                    list.innerHTML = `<li><em style="color:var(--text-muted);">${t('noItems')}</em></li>`;
                    document.getElementById('itemCount').innerText = `0 ${t('itemsTotal')}`;
                    this.updateDeleteButton();
                    return;
                }
                
                // DRY DOM Manipulation via DocumentFragment
                const fragment = document.createDocumentFragment();

                items.forEach((item, index) => {
                    const val = mode === 'local' ? item.name : item.TaskId;
                    let labelTxt = (mode === 'local' ? item.name : item.TaskName) || t('unknownItem');
                    if (!val) return;
                    
                    labelTxt = labelTxt.replace('/local/', '').replace('/history/', '');
                    const sizeTxt = (mode === 'local' && item.FileSize) ? this.formatSize(item.FileSize) : '';
                    
                    const li = document.createElement('li');
                    li.setAttribute('data-search', labelTxt.toLowerCase());
                    li.setAttribute('data-size', item.FileSize || 0);
                    
                    const cb = document.createElement('input');
                    cb.type = 'checkbox'; cb.value = val; cb.id = `item_${index}`;
                    cb.onchange = () => this.handleCheckbox();
                    
                    const label = document.createElement('label');
                    label.htmlFor = cb.id; label.className = 'item-content';
                    
                    let html = `<div class="item-header"><span>${labelTxt}</span><span class="item-meta">${sizeTxt}</span></div>`;
                    
                    if (mode === 'history' && item.BeginTime && item.EndTime) {
                        const sec = item.EndTime - item.BeginTime;
                        if (sec > 0) {
                            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
                            html += `<div class="item-subtitle">${t('printDuration')}: ${h > 0 ? h+'h ' : ''}${m}m</div>`;
                        }
                    }
                    
                    label.innerHTML = html;
                    li.appendChild(cb);
                    li.appendChild(label);
                    fragment.appendChild(li);
                });
                
                list.appendChild(fragment);
                this.filterItems(); // Apply active filter and count
            },

            // --- Interactions & Sorting ---
            getSearchRegex(query) {
                // Safe wildcard regex generation
                const escapeRegex = (s) => s.replace(/[-/\\^$*+?.()|[\]{}]/g, '\\$&');
                const str = query.split('*').map(escapeRegex).join('.*');
                return new RegExp(str, 'i');
            },

            filterItems() {
                const query = document.getElementById('searchInput').value.trim();
                const listItems = document.querySelectorAll('#itemList li[data-search]');
                let visible = 0;

                const regex = query ? this.getSearchRegex(query) : null;

                listItems.forEach(li => {
                    const term = li.getAttribute('data-search');
                    if (!regex || regex.test(term)) {
                        li.style.display = 'flex';
                        visible++;
                    } else {
                        li.style.display = 'none';
                        const cb = li.querySelector('input');
                        if (cb && cb.checked) cb.checked = false;
                    }
                });

                document.getElementById('itemCount').innerText = query 
                    ? `${t('showing')} ${visible} ${t('of')} ${State.items.length} ${t('items')}` 
                    : `${State.items.length} ${t('itemsTotal')}`;
                
                document.getElementById('selectAll').checked = false;
                this.updateDeleteButton();
            },

            toggleSelectAll() {
                const isChecked = document.getElementById('selectAll').checked;
                document.querySelectorAll('#itemList li:not([style*="display: none"]) input[type="checkbox"]')
                    .forEach(cb => cb.checked = isChecked);
                this.updateDeleteButton();
            },

            handleCheckbox() {
                const visible = Array.from(document.querySelectorAll('#itemList li:not([style*="display: none"]) input[type="checkbox"]'));
                document.getElementById('selectAll').checked = visible.length > 0 && visible.every(cb => cb.checked);
                this.updateDeleteButton();
            },

            updateDeleteButton(isDeleting = false) {
                const count = document.querySelectorAll('#itemList input[type="checkbox"]:checked').length;
                const btn = document.getElementById('deleteBtn');
                
                if (isDeleting) {
                    btn.disabled = true;
                    btn.innerHTML = `<span data-i18n="deletingBtn">${t('deletingBtn')}</span>`;
                    return;
                }

                btn.disabled = count === 0;
                btn.innerHTML = `<span data-i18n="deleteBtn">${t('deleteBtn')}</span> <span>(${count})</span>`;
            },

            async deleteSelected() {
                const checkedBoxes = document.querySelectorAll('#itemList input[type="checkbox"]:checked');
                const ids = Array.from(checkedBoxes).map(cb => cb.value);
                if (ids.length === 0) return;
                
                const tabName = State.activeTab === 'local' ? t('tabLocal') : t('tabHistory');
                const msg = `${t('confirmDelete1')}${ids.length}${t('confirmDelete2')}${tabName}${t('confirmDelete3')}`;
                
                if (await this.asyncConfirm(msg)) {
                    this.updateDeleteButton(true);
                    const cmd = State.activeTab === 'local' ? 259 : 322;
                    const data = State.activeTab === 'local' ? { FileList: ids } : { Id: ids };
                    State.ws.send(JSON.stringify(this.createPayload(cmd, data)));
                }
            },

            sortList(key) {
                const list = document.getElementById('itemList');
                const items = Array.from(list.querySelectorAll('li[data-search]'));
                if (!items.length) return;

                items.sort((a, b) => {
                    const v1 = key === 'name' ? a.getAttribute('data-search') : parseInt(a.getAttribute('data-size'));
                    const v2 = key === 'name' ? b.getAttribute('data-search') : parseInt(b.getAttribute('data-size'));
                    
                    if (key === 'name') return v1.localeCompare(v2) * State.sortDirection;
                    return (v1 - v2) * State.sortDirection;
                });

                State.sortDirection *= -1; // Flip for next click
                const fragment = document.createDocumentFragment();
                items.forEach(li => fragment.appendChild(li));
                list.appendChild(fragment); // Appending re-orders them automatically
            }
        };

        // Initialize App
        App.init();
    </script>
</body>
</html>
